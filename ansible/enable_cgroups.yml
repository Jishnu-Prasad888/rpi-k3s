---
- name: Enable cgroups for K3s on Raspberry Pi
  hosts: all
  become: true
  tasks:

    - name: Find the active cmdline.txt path
      stat:
        path: "{{ item }}"
      register: cmdline_paths
      loop:
        - /boot/firmware/cmdline.txt
        - /boot/cmdline.txt

    - name: Set path variable based on what exists
      set_fact:
        cmdline_file: "{{ (cmdline_paths.results | selectattr('stat.exists', 'equalto', true) | first).stat.path }}"

    - name: Ensure cgroup configurations exist in cmdline.txt
      replace:
        path: "{{ cmdline_file }}"
        regexp: '^([\w=,\-\s]+)(?!.*cgroup_enable=memory)(?!.*cgroup_memory=1)$'
        replace: '\1 cgroup_enable=memory cgroup_memory=1'
      register: cgroup_added

    - name: Reboot the Raspberry Pi if cmdline.txt was changed
      reboot:
        msg: "Rebooting to apply cgroup kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: cgroup_added.changed
