apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k3s-local-ca
  secretName: k3s-local-ca
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k3s-local-ca-issuer
spec:
  ca:
    secretName: k3s-local-ca
