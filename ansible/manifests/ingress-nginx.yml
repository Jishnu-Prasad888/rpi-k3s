apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ingress-nginx
  namespace: kube-system
spec:
  repo: https://kubernetes.github.io/ingress-nginx
  chart: ingress-nginx
  targetNamespace: ingress-nginx
  valuesContent: |-
    controller:
      kind: DaemonSet
      hostNetwork: false

      service:
        type: LoadBalancer

        annotations:
          metallb.universe.tf/address-pool: local-pool

      ingressClassResource:
        name: nginx
        enabled: true
        default: true

      ingressClass: nginx

      config:
        use-forwarded-headers: "true"
