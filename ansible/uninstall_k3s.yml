---
- name: Completely remove K3s from all Raspberry Pis
  hosts: rpi
  become: yes
  gather_facts: yes

  tasks:

    - name: Stop k3s service
      systemd:
        name: k3s
        state: stopped
      ignore_errors: yes

    - name: Stop k3s-agent service
      systemd:
        name: k3s-agent
        state: stopped
      ignore_errors: yes

    - name: Disable k3s
      systemd:
        name: k3s
        enabled: false
      ignore_errors: yes

    - name: Disable k3s-agent
      systemd:
        name: k3s-agent
        enabled: false
      ignore_errors: yes

    - name: Run K3s server uninstall script
      shell: /usr/local/bin/k3s-uninstall.sh
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Run K3s agent uninstall script
      shell: /usr/local/bin/k3s-agent-uninstall.sh
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Kill remaining container processes
      shell: |
        pkill -9 containerd || true
        pkill -9 kubelet || true
        pkill -9 flannel || true
        pkill -9 k3s || true
      ignore_errors: yes

    - name: Remove remaining directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /var/lib/cni
        - /etc/cni
        - /opt/cni
        - /run/k3s
        - /run/flannel
        - /var/lib/containerd
        - /etc/systemd/system/k3s.service
        - /etc/systemd/system/k3s-agent.service
        - /etc/systemd/system/k3s.service.env
        - /etc/systemd/system/k3s-agent.service.env

    - name: Remove K3s binaries
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/k3s
        - /usr/local/bin/kubectl
        - /usr/local/bin/crictl
        - /usr/local/bin/ctr

    - name: Remove kube config
      file:
        path: /root/.kube
        state: absent

    - name: Remove user kube config
      file:
        path: /home/rpi/.kube
        state: absent
      ignore_errors: yes

    - name: Delete flannel interface
      shell: ip link delete flannel.1
      ignore_errors: yes

    - name: Delete cni0 interface
      shell: ip link delete cni0
      ignore_errors: yes

    - name: Delete vxlan interface
      shell: ip link delete flannel-v6.1
      ignore_errors: yes

    - name: Flush iptables
      shell: |
        iptables -F
        iptables -t nat -F
        iptables -t mangle -F
        iptables -X
      ignore_errors: yes

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Reboot every Raspberry Pi
      reboot:
        reboot_timeout: 300
